<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面不存在</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f5f5f7; color: #1d1d1f;
    }
    .container { text-align: center; padding: 40px; }
    h1 { font-size: 72px; font-weight: 200; margin-bottom: 8px; }
    p { font-size: 16px; color: #86868b; margin-bottom: 32px; }
    a {
      display: inline-block; padding: 12px 28px;
      background: #0071e3; color: #fff; text-decoration: none;
      border-radius: 980px; font-size: 15px; font-weight: 500;
      transition: background 0.2s;
    }
    a:hover { background: #0077ed; }
    @media (prefers-color-scheme: dark) {
      body { background: #1d1d1f; color: #f5f5f7; }
      p { color: #98989d; }
    }
  </style>
  <script>
    var path = window.location.pathname;
    var target = path + (path.indexOf('?') === -1 ? '?' : '&') + '_r=' + Date.now();
    window.location.replace(target);
  </script>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>正在尝试恢复页面...</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
