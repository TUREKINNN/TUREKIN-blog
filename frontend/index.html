<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个啥也不是的博客" />
    <meta name="theme-color" content="#f5f5f7" />

    <!-- QQ / WeChat Link Preview (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TUREKINのblog" />
    <meta property="og:description" content="一个啥也不是的博客" />
    <meta property="og:url" content="https://www.turekin.me" />
    <meta property="og:image" content="https://www.turekin.me/uploads/avatars/1781084217969-8dq1c3.jpg" />
    <meta property="og:site_name" content="TUREKINのblog" />

    <link rel="icon" type="image/jpeg" href="/uploads/avatars/1781084217969-8dq1c3.jpg" />
    <title>TUREKINのblog</title>
  </head>
  <body class="antialiased">
    <!-- SVG 液态玻璃光学滤镜 — iOS 26 Liquid Glass 核心 -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
      <defs>
        <!-- 主折射：大尺度位移，模拟厚重玻璃的光线弯曲 -->
        <filter id="glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.015 0.015" numOctaves="2" seed="92" result="noise"/>
          <feGaussianBlur in="noise" stdDeviation="3" result="blurred"/>
          <feDisplacementMap in="SourceGraphic" in2="blurred" scale="30" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
          <feGaussianBlur in="displaced" stdDeviation="0.5"/>
        </filter>
        <!-- 轻折射：细微位移，用于小元素 -->
        <filter id="glass-distortion-light" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.02 0.02" numOctaves="2" seed="48" result="noise"/>
          <feGaussianBlur in="noise" stdDeviation="2" result="blurred"/>
          <feDisplacementMap in="SourceGraphic" in2="blurred" scale="15" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
          <feGaussianBlur in="displaced" stdDeviation="0.3"/>
        </filter>
      </defs>
    </svg>
    <!-- 自定义背景图片样式注入点 -->
    <style id="bg-image-style"></style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
